services:

  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: webanalysis
      POSTGRES_USER: exampleuser
      POSTGRES_PASSWORD: examplepwd
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
    volumes:
      - webanalysis-data:/var/lib/postgresql/data   

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
    - 8080:8080

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: webanalysis
      POSTGRES_USER: exampleuser
      POSTGRES_PASSWORD: examplepwd
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  webanalysis-data: